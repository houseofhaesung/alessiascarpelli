<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Work — Alessia Scarpelli</title>
  <meta name="description" content="Alessia Scarpelli — project." />

  <!-- Favicon (same set as the other pages) -->
  <link rel="icon" href="favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <link rel="preload" href="fonts/FacultyGlyphic-Regular.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Tailwind (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: '#0b0b0b', pink: '#FF3686' },
          fontFamily: {
            display: ['"Faculty Glyphic"', 'serif'],
            sans: ['"ABC Areal"', '"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    @font-face { font-family: "ABC Areal"; src: url("fonts/ABCAreal-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "ABC Areal"; src: url("fonts/ABCAreal-Bold.woff2")    format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: "Faculty Glyphic"; src: url("fonts/FacultyGlyphic-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }

    :root {
      --mpad: clamp(20px, 6.5vw, 32px);
      --pad: clamp(20px, 3.6vw, 72px);
      --col: 36.1vw;
      --header: clamp(72px, 10.4vh, 116px);
      --strip-top: 27.78vh;          /* photos start 300px from the top at 1080 */
      --gap: 1.25vw;                 /* 24px between photos at 1920 */
    }
    html, body { background: #fff; color: #0b0b0b; }
    body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    img { display: block; }

    /* page heading + sub-navigation (same on the category and project pages) */
    .wp-head { padding: 112px var(--mpad) 0; }
    .wp-title { font-family: "Faculty Glyphic", serif; font-weight: 400; line-height: 1.05;
                font-size: clamp(30px, 9vw, 44px); }
    .wp-subnav { margin-top: 10px; font-size: 15px; line-height: 1.5; }
    .wp-subnav a { color: #0b0b0b; transition: color .2s ease; }
    .wp-subnav a:hover, .wp-subnav a:focus-visible, .wp-subnav a[aria-current="page"] { color: #FF3686; outline: none; }
    .wp-subnav .sep { padding: 0 .25em; }

    /* the photo strip: a column on phones, a sideways strip on desktop */
    .strip { display: grid; gap: 14px; padding: 28px var(--mpad) 60px; }
    .strip img { width: 100%; height: auto; background: #f2f2f2; }
    .strip a { display: block; position: relative; overflow: hidden; }
    .strip a img { transition: transform .8s cubic-bezier(.22, 1, .36, 1), opacity .35s ease; }
    .strip a:hover img { transform: scale(1.025); }
    .strip a:focus-visible { outline: 2px solid #FF3686; outline-offset: 3px; }
    .strip-empty { padding: 28px var(--mpad); font-size: 15px; color: #555; }

    @media (min-width: 1024px) {
      html, body { height: 100%; overflow: hidden; }
      .wp-head { position: fixed; left: 0; top: 0; padding: 0 0 0 var(--pad); z-index: 20; pointer-events: none; }
      .wp-head * { pointer-events: auto; }
      .wp-title { position: absolute; left: var(--pad); top: 13.8vh; white-space: nowrap;
                  font-size: clamp(30pt, min(3.333vw, 5.93vh), 54pt); }
      .wp-subnav { position: absolute; left: var(--pad); top: 22.15vh; margin: 0; white-space: nowrap;
                   font-size: clamp(14px, min(1.453vw, 2.58vh), 30px); line-height: 1.2; }
      .viewport { position: fixed; left: 0; right: 0; top: var(--strip-top); bottom: 0; overflow: hidden; }
      .strip { display: flex; gap: var(--gap); padding: 0; height: 100%; width: max-content; will-change: transform; }
      .strip > * { flex: none; height: 100%; }
      .strip img { height: 100%; width: 100%; object-fit: cover; }
      .strip-empty { position: fixed; left: var(--pad); top: calc(var(--strip-top) + 8px); padding: 0; font-size: clamp(14px, 1.04vw, 20px); }
    }

    /* leaving for another page: everything fades out first */
    main { transition: opacity .4s ease; }
    main.is-leaving, main.is-hidden { opacity: 0; }
    @media (prefers-reduced-motion: reduce) { main, .strip a img { transition: none; } }

    /* project page — measured from the 1920 design: the photo is 1112px wide from the left edge,
       the heading starts at 1160px, three lines in the display face at heading size */
    .cover { margin: 0; }
    .info { padding: 6px 0 0; }
    .heading { font-family: "Faculty Glyphic", serif; font-weight: 400; text-transform: uppercase;
               font-size: clamp(30px, 9vw, 44px); line-height: 1.03; }
    .heading span { display: block; }
    .desc { margin-top: 18px; font-size: 15px; line-height: 1.45; max-width: 46ch; }
    .desc p + p { margin-top: .8em; }
    .credits { margin-top: 16px; display: grid; grid-template-columns: auto 1fr; gap: 2px 16px; font-size: 14px; line-height: 1.4; }
    .credits dt { font-weight: 700; }
    @media (min-width: 1024px) {
      .strip > .cover { width: 57.92vw; }
      .strip > .info { width: 39.6vw; padding: 1.0vh 0 0 1.25vw; height: auto; align-self: flex-start; }
      .heading { font-size: clamp(30pt, min(3.333vw, 5.93vh), 54pt); }
      .desc { margin-top: 4vh; font-size: clamp(13px, min(1.04vw, 1.85vh), 20px); line-height: 1.4; max-width: 28vw; }
      .credits { margin-top: 2.4vh; font-size: clamp(12px, min(.83vw, 1.5vh), 16px); }
      .strip > .extra { width: auto; }
      .strip > .extra img { width: auto; }
    }
    @media (max-width: 1023.98px) { .info { order: -1; } }
  </style>
</head>

<body class="font-sans">

  <!-- ================= HEADER (same as about.html) ================= -->
  <header class="fixed inset-x-0 top-0 z-50 bg-white">
    <!-- desktop -->
    <nav class="hidden lg:flex items-center h-[var(--header)] px-[var(--pad)] relative">
      <ul class="flex gap-[2.4vw] text-[clamp(10.5pt,1.25vw,19.5pt)] font-bold">
        <li><a href="category.html#selected-works" data-work-menu aria-current="page" class="text-pink transition-colors hover:text-pink">WORK</a></li>
        <li><a href="about.html" class="text-ink transition-colors hover:text-pink">ABOUT</a></li>
      </ul>
      <a href="index.html" class="absolute left-[var(--col)] top-1/2 -translate-y-1/2" aria-label="Alessia Scarpelli — home">
        <img src="images/logo.png" alt="Alessia Scarpelli" class="w-[clamp(240px,24.6vw,480px)] h-auto" />
      </a>
      <ul class="ml-auto flex gap-[1.9vw] text-[clamp(10.5pt,1.25vw,19.5pt)] font-bold">
        <li><a href="#" class="text-ink transition-colors hover:text-pink">PRESS</a></li>
        <li><a href="#" class="text-ink transition-colors hover:text-pink">CONTACT</a></li>
      </ul>
    </nav>
    <!-- mobile: logo + stack icon (menu.js) -->
    <nav class="lg:hidden flex items-center justify-between h-[72px] px-[var(--mpad)]">
      <a href="index.html" aria-label="Alessia Scarpelli — home">
        <img src="images/logo.png" alt="Alessia Scarpelli" class="w-[min(68vw,300px)] h-auto" />
      </a>
      <button type="button" class="menu-btn" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
        <svg class="i-open" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M1 4.5h20M1 11h20M1 17.5h20"/></svg>
        <svg class="i-close" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M3.5 3.5l15 15M18.5 3.5l-15 15"/></svg>
      </button>
    </nav>
  </header>

  <!-- mobile menu (opened by the stack icon) -->
  <nav id="mobile-menu" class="mobile-menu" hidden aria-label="Menu">
    <ul>
      <li><a href="category.html#selected-works" data-mobile-work aria-current="page">WORK</a></li>
      <li><a href="about.html">ABOUT</a></li>
      <li><a href="#">PRESS</a></li>
      <li><a href="#">CONTACT</a></li>
    </ul>
  </nav>

  <!-- ================= PROJECT ================= -->
  <main id="page">
    <!-- category heading + sub-pages (filled from works.js) -->
    <div class="wp-head">
      <h1 id="title" class="wp-title"></h1>
      <nav id="subnav" class="wp-subnav" aria-label="Sections"></nav>
    </div>
    <div class="viewport" id="viewport">
      <div class="strip" id="strip">
        <figure class="cover" id="cover"></figure>
        <section class="info">
          <h2 id="heading" class="heading"></h2>
          <div id="desc" class="desc"></div>
          <dl id="credits" class="credits"></dl>
        </section>
      </div>
    </div>
  </main>



  <script src="works.js"></script>
  <script>
    /* Desktop: the wheel (or a sideways trackpad swipe, or ←/→) slides the strip sideways, softly.
       Phones: the strip is a normal vertical column. */
    function sideways(viewport, strip) {
      const desktop = matchMedia('(min-width: 1024px)');
      const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let x = 0, target = 0, max = 0;
      const measure = () => { max = Math.max(0, strip.scrollWidth - viewport.clientWidth); target = Math.min(target, max); };
      viewport.addEventListener('wheel', (e) => {
        if (!desktop.matches) return;
        e.preventDefault();
        const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        target = Math.max(0, Math.min(max, target + d * (e.deltaMode === 1 ? 16 : 1)));
      }, { passive: false });
      addEventListener('keydown', (e) => {
        if (!desktop.matches || !['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
        if (document.documentElement.classList.contains('wm-lock')) return;
        e.preventDefault();
        const step = (strip.firstElementChild?.getBoundingClientRect().width || 400) + 24;
        target = Math.max(0, Math.min(max, target + (e.key === 'ArrowRight' ? step : -step)));
      });
      (function tick() {
        if (desktop.matches) {
          x += (target - x) * (REDUCED ? 1 : 0.1);
          if (Math.abs(target - x) < 0.1) x = target;
          strip.style.transform = `translate3d(${-x.toFixed(1)}px,0,0)`;
        } else strip.style.transform = '';
        requestAnimationFrame(tick);
      })();
      addEventListener('resize', measure);
      addEventListener('load', measure);
      return { measure, reset() { x = target = 0; measure(); } };
    }

    /* Desktop, with a footer below: the page scrolls normally, and while the photo stage is pinned
       the vertical scroll is turned into sideways movement of the strip (softly eased).
       Once the last photo is in view the page carries on down to the footer. */
    function scrollSideways(wrap, strip) {
      const desktop = matchMedia('(min-width: 1024px)');
      const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let x = 0, max = 0;
      const measure = () => {
        if (!desktop.matches) { wrap.style.removeProperty('--hh'); return; }
        max = Math.max(0, strip.scrollWidth - innerWidth);
        wrap.style.setProperty('--hh', (innerHeight + max) + 'px');
      };
      const target = () => Math.min(max, Math.max(0, scrollY - wrap.offsetTop));
      addEventListener('wheel', (e) => {             // sideways trackpad swipes also move the strip
        if (!desktop.matches || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
        e.preventDefault(); scrollBy(0, e.deltaX);
      }, { passive: false });
      addEventListener('keydown', (e) => {
        if (!desktop.matches || !['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
        if (document.documentElement.classList.contains('wm-lock')) return;
        e.preventDefault();
        const step = (strip.firstElementChild?.getBoundingClientRect().width || 400) + 24;
        scrollBy({ top: e.key === 'ArrowRight' ? step : -step, behavior: REDUCED ? 'auto' : 'smooth' });
      });
      (function tick() {
        if (desktop.matches) {
          const t = target();
          x += (t - x) * (REDUCED ? 1 : 0.12);
          if (Math.abs(t - x) < 0.1) x = t;
          strip.style.transform = `translate3d(${-x.toFixed(1)}px,0,0)`;
        } else strip.style.transform = '';
        requestAnimationFrame(tick);
      })();
      addEventListener('resize', measure);
      addEventListener('load', measure);
      strip.addEventListener('load', measure, true);     // each photo that finishes loading
      return { measure, reset() { x = 0; measure(); } };
    }

    // links inside main: fade out, then go (new-tab clicks behave normally)
    function fadeLinks(main) {
      main.addEventListener('click', (e) => {
        const a = e.target.closest('a');
        if (!a || e.metaKey || e.ctrlKey || e.shiftKey || a.target === '_blank') return;
        if (a.pathname === location.pathname) return;                  // same page, only the # changes
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        e.preventDefault(); main.classList.add('is-leaving');
        setTimeout(() => { location.href = a.href; }, 350);
      });
      addEventListener('pageshow', () => main.classList.remove('is-leaving'));
    }

    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function fillHead(place, link) {
      $('title').textContent = place.cat.title;
      const subs = place.cat.subs || [];
      $('subnav').innerHTML = subs.map((s) =>
        `<a href="${link}#${esc(s.id)}"${place.sub && s.id === place.sub.id ? ' aria-current="page"' : ''}>${esc(s.title)}</a>`
      ).join('<span class="sep" aria-hidden="true">|</span>');
      $('subnav').hidden = !subs.length;
    }

    const main = $('page');
    const strip = $('strip');
    const slide = sideways($('viewport'), strip);
    fadeLinks(main);
    const img = (p, eager) => `<img src="${esc(p.src)}" width="${p.w}" height="${p.h}" alt="${esc(p.alt || '')}" ${eager ? '' : 'loading="lazy"'} decoding="async" />`;

    function show() {
      const W = window.WORKS || [];
      const w = W.find((x) => x.id === decodeURIComponent(location.hash.slice(1))) || W[0];
      if (!w) return;
      const place = window.findPlace(w.sub || w.category);
      document.title = `${w.title} — Alessia Scarpelli`;
      fillHead(place, 'category.html');
      $('cover').innerHTML = img(w.cover, true);
      $('heading').innerHTML = (w.heading || [w.year, w.title]).filter(Boolean).map((l) => `<span>${esc(l)}</span>`).join('');
      $('desc').innerHTML = String(w.description || '').split(/\n\s*\n/).filter(Boolean).map((p) => `<p>${p}</p>`).join('');
      $('credits').innerHTML = (w.credits || []).map(([r, n]) => `<dt>${esc(r)}</dt><dd>${esc(n)}</dd>`).join('');
      strip.querySelectorAll('.extra').forEach((n) => n.remove());
      (w.images || []).forEach((p) => { const f = document.createElement('figure'); f.className = 'extra'; f.style.margin = '0'; f.innerHTML = img(p, false); strip.appendChild(f); });
      slide.reset();
      requestAnimationFrame(() => main.classList.remove('is-hidden'));
    }
    addEventListener('hashchange', () => { main.classList.add('is-hidden'); setTimeout(show, 300); });
    main.classList.add('is-hidden');
    show();

  </script>
  <script src="workmenu.js"></script>
  <script src="menu.js"></script>
</body>
</html>

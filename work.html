<html lang="en">
<head>

  <meta name="description" content="Alessia Scarpelli — project." />

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />

  <!-- Tailwind (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          screens: { lg: '768px' },      // desktop layout from 768px (iPad) up
          colors: { ink: '#0b0b0b', pink: '#FF3686' },
          fontFamily: {
            display: ['"Faculty Glyphic"', 'serif'],
            sans: ['"ABC Areal"', '"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    @font-face { font-family: "ABC Areal"; src: url("fonts/ABCAreal-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "ABC Areal"; src: url("fonts/ABCAreal-Bold.woff2")    format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: "Faculty Glyphic"; src: url("fonts/FacultyGlyphic-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }

    @font-face { font-family: "ABC Areal"; src: url("fonts/ABCAreal-Medium.woff2")  format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
    :root {
      --mpad: clamp(20px, 6.5vw, 32px);
      --pad: clamp(20px, 3.6vw, 69px);
      --header: clamp(72px, 11.57vh, 130px);   /* 125px at 1080, with a 1px line under it */
      --side: 32.97vw;                          /* black text column: 633px at 1920 */
    }
    html, body { background: #fff; color: #0b0b0b; }
    body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    img { display: block; }

    /* leaving for another page: everything fades out first */
    main { transition: opacity .4s ease; }
    main.is-leaving, main.is-hidden { opacity: 0; }
    @media (prefers-reduced-motion: reduce) { main { transition: none; } }

    /* ---------- phones: one column ---------- */
    main { padding-top: 78px; }
    .side { padding: 26px var(--mpad) 40px; background: #000; color: #fff; }
    .heading { font-family: "Faculty Glyphic", serif; font-weight: 400; margin: 22px 0 0;
               font-size: min(11vw, 48px); line-height: 1.13; }
    .heading span { display: block; }
    .subtitle { margin-top: 10px; font-size: min(5.4vw, 24px); line-height: 1.3; }
    .subtitle a { color: #FF3686; text-decoration: underline; text-underline-offset: .14em; text-decoration-thickness: 1px; }
    .subtitle a:hover, .subtitle a:focus-visible { text-decoration-thickness: 2px; outline: none; }
    .lede { margin-top: 34px; font-size: 15px; line-height: 1.45; }
    .lede.big { font-size: 18px; line-height: 1.42; }
    .lede p + p, .txt p + p { margin-top: 1.1em; }
    .prev { display: inline-flex; align-items: center; gap: .45em; text-transform: uppercase;
            font-size: min(4.6vw, 20px); line-height: 1; color: #0b0b0b; transition: color .2s ease; }
    .side .prev { color: #fff; }
    .prev svg { width: 1.45em; height: .7em; }
    .prev:hover, .prev:active, .prev:focus-visible { color: #FF3686 !important; outline: none; }   /* pink on hover / tap */
    .after { padding: 36px var(--mpad) 56px; border-top: 1px solid #0b0b0b; margin-top: 40px; }
    .strip { display: flex; flex-direction: column; gap: 5px; }
    .pn { margin: 0; position: relative; }
    .pn img, .pn video { width: 100%; height: auto; background: #f2f2f2; display: block; }
    .pn.inset { padding: 18px var(--mpad); }
    .pn.inset img, .pn.inset video { background: none; }
    .txt { padding: 26px var(--mpad) 10px; font-size: 15px; line-height: 1.45; }

    /* ---------- desktop: black text column + photo panels sliding sideways ----------
       Each screen is two panels side by side, split by a 1px line. A photo either fills
       its panel or sits inside it on white, exactly where the design puts it (box). */
    @media (min-width: 768px) {
      html, body { height: 100%; overflow: hidden; }
      main { padding: 0; }
      .side { position: fixed; left: 0; top: var(--header); bottom: 0; width: var(--side); padding: 0 var(--pad);
              z-index: 20; overflow: hidden; }
      .side .prev { position: absolute; left: var(--pad); top: min(4.8vh, 2.7vw); font-size: min(1.46vw, 2.59vh); }
      .heading { margin: 0; padding-top: min(10.2vh, 5.75vw); font-size: min(3.333vw, 5.926vh); line-height: 1.125; }
      .subtitle { margin-top: .55em; font-size: min(1.667vw, 2.963vh); }
      .lede { position: absolute; left: calc(var(--pad) + .2vw); top: min(41.3vh, 23.2vw); margin: 0;
              width: 21.5vw; font-size: min(1.042vw, 1.852vh); line-height: 1.4; }
      .long .lede { top: min(44.6vh, 25.1vw); }   /* a four-line title: the text starts a little lower */
      .lede.big { left: var(--pad); width: 24vw; font-size: min(1.5625vw, 2.778vh); line-height: 1.47; }
      .after { display: none; }
      .viewport { position: fixed; left: var(--side); right: 0; top: calc(var(--header) + 1px); bottom: 0; overflow: hidden; }
      .strip { flex-direction: row; gap: 0; height: 100%; width: max-content; will-change: transform; }
      .pn { flex: none; width: calc((100vw - var(--side)) / 2); height: 100%; border-right: 1px solid #0b0b0b; overflow: hidden; }
      .pn.wide { width: calc(100vw - var(--side)); }
      .pn.inset { padding: 0; }
      .pn img, .pn video { position: absolute; object-fit: cover; height: auto; }
      .pn.full img, .pn.full video { inset: 0; width: 100%; height: 100%; }
      .txt { padding: min(7.9vh, 4.43vw) min(2.97vw, 5.3vh) 0; font-size: min(1.042vw, 1.852vh); line-height: 1.4; }
      .txt > div { max-width: 25.2vw; }
      .txt p + p { margin-top: 1.4em; }
    }
  </style>
  <script src="loader.js?v=1030i"></script>
</head>

<body class="font-sans">

  <!-- ================= PROJECT ================= -->
  <main id="page">
    <!-- black column: previous, title, short text (filled from works.js) -->
    <aside class="side">
      <a class="prev" href="category.html"><svg viewBox="0 0 40 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M39 10H2M10 2L2 10l8 8"/></svg><span>Previous</span></a>
      <h1 id="heading" class="heading"></h1>
      <p id="subtitle" class="subtitle"></p>
      <div id="lede" class="lede"></div>
    </aside>
    <!-- photo and text panels: sideways on desktop, one column on phones -->
    <div class="viewport" id="viewport">
      <div class="strip" id="strip"></div>
    </div>
    <div class="after"><a class="prev" href="category.html"><svg viewBox="0 0 40 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M39 10H2M10 2L2 10l8 8"/></svg><span>Previous</span></a></div>
  </main>

  <script src="works.js?v=1030i"></script>
  <script>
    /* Desktop: the wheel (or a sideways trackpad swipe, or ←/→) slides the strip sideways, softly.
       Phones: the strip is a normal vertical column. */
    function sideways(viewport, strip) {
      const desktop = matchMedia('(min-width: 768px)');
      const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let x = 0, target = 0, max = 0;
      const measure = () => { max = Math.max(0, strip.scrollWidth - viewport.clientWidth); target = Math.min(target, max); };
      addEventListener('wheel', (e) => {                // anywhere on the page, also over the title column
        if (!desktop.matches || document.documentElement.classList.contains('wm-lock')) return;
        e.preventDefault();
        const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        target = Math.max(0, Math.min(max, target + d * (e.deltaMode === 1 ? 16 : 1)));
      }, { passive: false });
      addEventListener('keydown', (e) => {
        if (!desktop.matches || !['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
        if (document.documentElement.classList.contains('wm-lock')) return;
        e.preventDefault();
        const step = (strip.firstElementChild?.getBoundingClientRect().width || 400) + 24;
        target = Math.max(0, Math.min(max, target + (e.key === 'ArrowRight' ? step : -step)));
      });
      (function tick() {
        if (desktop.matches) {
          x += (target - x) * (REDUCED ? 1 : 0.1);
          if (Math.abs(target - x) < 0.1) x = target;
          strip.style.transform = `translate3d(${-x.toFixed(1)}px,0,0)`;
        } else strip.style.transform = '';
        requestAnimationFrame(tick);
      })();
      addEventListener('resize', measure);
      addEventListener('load', measure);
      strip.addEventListener('load', measure, true);     // each photo that finishes loading
      return { measure, reset() { x = target = 0; measure(); },
               to(el) { measure(); target = Math.max(0, Math.min(max, el.offsetLeft)); } };
    }

    /* Desktop, with a footer below: the page scrolls normally, and while the photo stage is pinned
       the vertical scroll is turned into sideways movement of the strip (softly eased).
       Once the last photo is in view the page carries on down to the footer. */
    function scrollSideways(wrap, strip) {
      const desktop = matchMedia('(min-width: 768px)');
      const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let x = 0, max = 0;
      const measure = () => {
        if (!desktop.matches) { wrap.style.removeProperty('--hh'); return; }
        max = Math.max(0, strip.scrollWidth - innerWidth);
        wrap.style.setProperty('--hh', (innerHeight + max) + 'px');
      };
      const target = () => Math.min(max, Math.max(0, scrollY - wrap.offsetTop));
      addEventListener('wheel', (e) => {             // sideways trackpad swipes also move the strip
        if (!desktop.matches || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
        e.preventDefault(); scrollBy(0, e.deltaX);
      }, { passive: false });
      addEventListener('keydown', (e) => {
        if (!desktop.matches || !['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
        if (document.documentElement.classList.contains('wm-lock')) return;
        e.preventDefault();
        const step = (strip.firstElementChild?.getBoundingClientRect().width || 400) + 24;
        scrollBy({ top: e.key === 'ArrowRight' ? step : -step, behavior: REDUCED ? 'auto' : 'smooth' });
      });
      (function tick() {
        if (desktop.matches) {
          const t = target();
          x += (t - x) * (REDUCED ? 1 : 0.12);
          if (Math.abs(t - x) < 0.1) x = t;
          strip.style.transform = `translate3d(${-x.toFixed(1)}px,0,0)`;
        } else strip.style.transform = '';
        requestAnimationFrame(tick);
      })();
      addEventListener('resize', measure);
      addEventListener('load', measure);
      strip.addEventListener('load', measure, true);     // each photo that finishes loading
      return { measure, reset() { x = 0; measure(); } };
    }

    // links inside main: fade out, then go (new-tab clicks behave normally)
    function fadeLinks(main) {
      main.addEventListener('click', (e) => {
        const a = e.target.closest('a');
        if (!a || e.metaKey || e.ctrlKey || e.shiftKey || a.target === '_blank') return;
        if (a.pathname === location.pathname) return;                  // same page, only the # changes
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        e.preventDefault(); main.classList.add('is-leaving');
        setTimeout(() => { location.href = a.href; }, 350);
      });
      addEventListener('pageshow', () => main.classList.remove('is-leaving'));
    }

    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const main = $('page');
    const strip = $('strip');
    const viewport = $('viewport');
    const slide = sideways(viewport, strip);
    fadeLinks(main);
    const img = (p, eager, still) => (p.video && !still)
      ? `<video src="${esc(p.video)}" poster="${esc(p.src)}" width="${p.w}" height="${p.h}" muted loop autoplay playsinline aria-label="${esc(p.alt || '')}"></video>`
      : `<img src="${esc(p.src)}" width="${p.w}" height="${p.h}" alt="${esc(p.alt || '')}" ${eager ? '' : 'loading="lazy"'} decoding="async" />`;

    // PREVIOUS: back to where you came from on this site, otherwise to the project's category
    document.querySelectorAll('.prev').forEach((a) => a.addEventListener('click', (e) => {
      let ref = null; try { ref = new URL(document.referrer); } catch (_) {}
      if (ref && ref.origin === location.origin && ref.pathname !== location.pathname && history.length > 1) { e.preventDefault(); e.stopPropagation(); history.back(); }
    }, true));

    function panel(p, eager) {
      if (p.text) return `<div class="pn txt"><div>${p.text.map((t) => `<p>${t}</p>`).join('')}</div></div>`;
      const b = p.box || [0, 0, 100, 100];
      const full = b[2] >= 99.5 && b[3] >= 99.5;
      const pos = full ? '' : ` style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%"`;
      return `<figure class="pn ${full ? 'full' : 'inset'}${p.wide ? ' wide' : ''}">${img(p, eager).replace('<img ', `<img${pos} `).replace('<video ', `<video${pos} `)}</figure>`;
    }

    function show() {
      const W = window.WORKS || [];
      let w = W.find((x) => x.id === decodeURIComponent(location.hash.slice(1))) || W[0];
      if (w && w.link) { const t = W.find((x) => x.id === w.link); if (t) { history.replaceState(null, '', '#' + t.id); w = t; } }
      if (!w) return;
      const place = window.findPlace(w.sub || w.category);
      document.title = `${w.title} — Alessia Scarpelli`;
      const back = `category.html#${encodeURIComponent((place.sub || place.cat).id)}`;
      document.querySelectorAll('.prev').forEach((a) => { a.href = back; });
      $('heading').innerHTML = (w.heading || [w.year, w.title]).filter(Boolean).map((l) => `<span>${esc(l)}</span>`).join('');
      $('subtitle').innerHTML = w.subtitleLink
        ? `<a href="${esc(w.subtitleLink)}" target="_blank" rel="noopener">${esc(w.subtitle || '')}</a>` : esc(w.subtitle || '');
      $('subtitle').hidden = !w.subtitle;
      const paras = (Array.isArray(w.description) ? w.description : String(w.description || '').split(/\n\s*\n/)).filter(Boolean);
      document.querySelector('.side').classList.toggle('long', (w.heading || []).length > 3);
      $('lede').innerHTML = paras.map((p) => `<p>${p}</p>`).join('');
      $('lede').classList.toggle('big', paras.join(' ').length < 160);   // a short text is set larger
      const panels = (w.panels && w.panels.length) ? w.panels : [w.cover].filter(Boolean);
      strip.innerHTML = panels.map((p, k) => panel(p, k < 3)).join('');
      slide.reset();
      requestAnimationFrame(() => main.classList.remove('is-hidden'));
    }
    addEventListener('hashchange', () => { main.classList.add('is-hidden'); setTimeout(show, 300); });
    main.classList.add('is-hidden');
    show();

  </script>
  <script src="workmenu.js?v=1030i"></script>
  <script src="menu.js?v=1030i"></script>
</body>

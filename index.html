<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alessia Scarpelli</title>
  <meta name="description" content="Alessia Scarpelli — fashion designer and pattern maker." />

  <!-- Favicon (same set as about.html) -->
  <link rel="icon" href="favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <link rel="preload" href="fonts/ABCAreal-Bold.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Tailwind (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          screens: { lg: '768px' },      // desktop layout from 768px (iPad) up
          colors: { ink: '#0b0b0b', pink: '#FF3686' },
          fontFamily: {
            display: ['"Faculty Glyphic"', 'serif'],
            sans: ['"ABC Areal"', '"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    @font-face { font-family: "ABC Areal"; src: url("fonts/ABCAreal-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "ABC Areal"; src: url("fonts/ABCAreal-Bold.woff2")    format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: "Faculty Glyphic"; src: url("fonts/FacultyGlyphic-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }

    :root {
      --pad: clamp(20px, 3.6vw, 72px);
      --mpad: clamp(20px, 6.5vw, 32px);   /* phone side margin */
      --col: 36.1vw;
      --header: clamp(72px, 10.4vh, 116px);
    }
    html, body { height: 100%; background: #fff; color: #0b0b0b; }
    body { margin: 0; overflow: hidden; -webkit-font-smoothing: antialiased; }
    img { display: block; }

    /* ---------- Desktop home: category spines (spines.js) ----------
       measured from the 1920×1080 design: spines 126px wide, 12px apart,
       photos 4:5 and as tall as the space under the header */
    .spines { display: none; }
    @media (min-width: 768px) {
      .spines {
        --spine: 7.135vw;                              /* 137px at 1920 */
        --gap: 0px;                                    /* no gaps: labels and photos touch */
        display: block; position: fixed; left: 0; right: 0; bottom: 0;
        top: max(72px, 10.65vh);                       /* just under the header: 115px at 1080 */
        overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none;
        opacity: 0; transition: opacity .8s ease .1s;
      }
      .spines.is-ready { opacity: 1; }
      .sp-track { position: absolute; top: 0; bottom: 0; left: 0; will-change: transform; }
      .sp-cover { position: absolute; left: 0; top: 0; bottom: 0; background: #FF3686; }
      .sp-photo { position: absolute; top: 0; bottom: 0; display: block; overflow: hidden; background: #f2f2f2; -webkit-user-drag: none; }
      .sp-photo img { width: 100%; height: 100%; object-fit: cover; pointer-events: none;
                      transition: transform .9s cubic-bezier(.22, 1, .36, 1); }
      .sp-photo:hover img { transform: scale(1.02); }
      .sp-photo:focus-visible { outline: 3px solid #FF3686; outline-offset: -3px; }

      .sp-spine {
        position: absolute; left: 0; top: 0; bottom: 0; width: var(--spine); z-index: 2;
        display: flex; justify-content: center; align-items: flex-start;
        padding: 3.7vh 0 0; margin: 0; border: 0; font: inherit; will-change: transform;
      }
      /* white 12px gutters either side, so photos sliding behind never show in the gaps */
      .sp-spine::before, .sp-spine::after { content: ""; position: absolute; top: 0; bottom: 0; width: var(--gap); background: #fff; }
      .sp-spine::before { right: 100%; }
      .sp-spine::after { left: 100%; }
      .sp-spine.is-first::before { display: none; }   /* the first spine joins the pink cover */
      .sp-spine:focus-visible { outline: 3px solid #0b0b0b; outline-offset: -6px; }
      .sp-label {
        writing-mode: vertical-rl; transform: rotate(180deg);   /* reads bottom to top */
        font-family: "Faculty Glyphic", serif; font-weight: 400; text-transform: uppercase;
        font-size: max(18px, min(1.875vw, 3.333vh)); line-height: 1; white-space: nowrap;   /* 36px at 1920×1080 (Figma size 36) */
      }
      /* label colours: open = pink with white text; closed = white with black text and a 2px black border */
      .sp-spine          { background: #fff; color: #0b0b0b; box-shadow: inset 1px 1px 0 #0b0b0b;   /* 1px lines on the left and top */
                           transition: background-color .45s ease, color .45s ease; }
      .sp-spine.is-open  { background: #FF3686; color: #fff; box-shadow: none; }
    }

    /* ---------- Phone home: category bands (spines.js), measured on a 412×917 phone ----------
       one screen, an accordion: bands 64px tall, 7px apart, first one at 79px;
       the open band's photo row fills the rest and its photos are swiped sideways */
    .mspines { display: none; }
    @media (max-width: 767.98px) {
      html:has(.mspines), html:has(.mspines) body { height: 100%; overflow: hidden; }
      .mspines { --top: calc(72px + 11.7svh); --gap: 0px;   /* first band at 179px on a 917px-tall phone */ --ease: cubic-bezier(.65, 0, .35, 1); --dur: .9s;
                 display: flex; flex-direction: column; position: fixed; inset: 0; overflow: hidden;
                 padding-top: var(--top); touch-action: pan-x; }   /* vertical swipes change category */
      .ms-band {
        flex: none; position: relative; z-index: 2; width: 100%; height: 64px; margin: 0; padding: 0 25px; border: 0;
        display: flex; align-items: center;
        font-family: "Faculty Glyphic", serif; font-weight: 400; text-transform: uppercase; text-align: left;
        font-size: clamp(20px, 6.3vw, 30px); line-height: 1; letter-spacing: 0;
        background: #fff; color: #0b0b0b; box-shadow: inset 0 1px 0 #0b0b0b;   /* 1px line on top */
        transition: background-color .5s ease, color .5s ease, box-shadow .5s ease;
      }
      .ms-band + .ms-row + .ms-band, .ms-row + .ms-band { margin-top: var(--gap); }
      .ms-band.is-open { background: #FF3686; color: #fff; box-shadow: none; }
      .ms-band:focus-visible { outline: 3px solid #FF3686; outline-offset: -6px; }
      .ms-row { flex: none; height: 0; overflow: hidden; position: relative;
                transition: height var(--dur) var(--ease); }
      .ms-scroll {
        position: absolute; left: 0; right: 0; top: 0; height: var(--ph);
        display: flex; gap: 0; overflow-x: auto; overflow-y: hidden;
        scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none;
      }
      .ms-scroll::-webkit-scrollbar { display: none; }
      .ms-photo { flex: none; height: 100%; aspect-ratio: 333 / 485;   /* about 81% of the screen width */ scroll-snap-align: start; background: #f2f2f2; }
      .ms-photo img { width: 100%; height: 100%; object-fit: cover; }
      .mspines:not(.is-ready) .ms-row, .mspines:not(.is-ready) .ms-band { transition: none; }
      @media (prefers-reduced-motion: reduce) { .ms-row, .ms-band { transition: none; } }
    }

  </style>
</head>

<body class="font-sans">

  <!-- ================= HEADER (same as about.html) ================= -->
  <header class="fixed inset-x-0 top-0 z-50 bg-white">
    <!-- desktop -->
    <nav class="hidden lg:flex items-center h-[var(--header)] px-[var(--pad)] relative">
      <ul class="flex gap-[2.4vw] text-[clamp(10.5pt,1.25vw,19.5pt)] font-bold">
        <li><a href="category.html#selected-works" data-work-menu class="text-ink transition-colors hover:text-pink">WORK</a></li>
        <li><a href="about.html" class="text-ink transition-colors hover:text-pink">ABOUT</a></li>
      </ul>
      <a href="index.html" class="absolute left-[var(--col)] top-1/2 -translate-y-1/2" aria-label="Alessia Scarpelli — home" aria-current="page">
        <img src="images/logo.png" alt="Alessia Scarpelli" class="w-[clamp(240px,24.6vw,480px)] h-auto" />
      </a>
      <ul class="ml-auto flex gap-[1.9vw] text-[clamp(10.5pt,1.25vw,19.5pt)] font-bold">
        <li><a href="#" class="text-ink transition-colors hover:text-pink">PRESS</a></li>
        <li><a href="#" class="text-ink transition-colors hover:text-pink">CONTACT</a></li>
      </ul>
    </nav>
    <!-- mobile: logo + stack icon (menu.js) -->
    <nav class="lg:hidden flex items-center justify-between h-[72px] px-[var(--mpad)]">
      <a href="index.html" aria-label="Alessia Scarpelli — home">
        <img src="images/logo.png" alt="Alessia Scarpelli" class="w-[min(68vw,300px)] h-auto" />
      </a>
      <button type="button" class="menu-btn" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
        <svg class="i-open" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M1 4.5h20M1 11h20M1 17.5h20"/></svg>
        <svg class="i-close" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M3.5 3.5l15 15M18.5 3.5l-15 15"/></svg>
      </button>
    </nav>
  </header>

  <!-- mobile menu (opened by the stack icon) -->
  <nav id="mobile-menu" class="mobile-menu" hidden aria-label="Menu">
    <ul>
      <li><a href="category.html#selected-works" data-mobile-work>WORK</a></li>
      <li><a href="about.html">ABOUT</a></li>
      <li><a href="#">PRESS</a></li>
      <li><a href="#">CONTACT</a></li>
    </ul>
  </nav>

  <!-- Desktop & iPad (768px and up): category spines. Built by spines.js from HOME in works.js -->
  <main id="spines" class="spines" aria-label="Work, by category. Scroll or click a category to open it."></main>

  <!-- Phones: the same categories as stacked bands. Also built by spines.js -->
  <main id="mspines" class="mspines" aria-label="Work, by category"></main>

  <!-- Order matters: works.js first (the content), then the scripts that use it -->
  <script src="works.js"></script>
  <script src="spines.js"></script>
  <script src="workmenu.js"></script>
  <script src="menu.js"></script>
</body>
</html>
